[package]
name = "manifestdiff"
version = "0.1.0"
edition = "2021"
description = "Diffs two Kubernetes Deployment manifests and flags risky or breaking changes — removed env vars, image tag swaps, scaled-down replicas, dropped volume mounts, and lost health probes"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/manifestdiff"
readme = "README.md"
keywords = ["kubernetes", "k8s", "diff", "deployment", "cli"]
categories = ["command-line-utilities"]

[lib]
name = "manifestdiff"
path = "src/lib.rs"

[[bin]]
name = "manifestdiff"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
